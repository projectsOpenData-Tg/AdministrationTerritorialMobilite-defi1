name: Dashboard CI → PR vers main

# Se déclenche à chaque push sur dev qui touche le code de l'app du tableau de bord.
# Étapes : repérer les fichiers modifiés → vérifications Python (install, compilation, imports)
#          → build d'un conteneur, lancement de l'app, test qu'elle répond
#          → si tout est vert, ouverture (ou mise à jour) d'une PR dev → main.
on:
  push:
    branches: [dev]
    paths:
      - 'dashboard/**'

# Le job qui ouvre la PR a besoin d'écrire des pull requests ; le reste ne fait que lire.
# NB : pour que GITHUB_TOKEN puisse créer la PR, cocher dans les réglages du dépôt
#      Settings → Actions → General → « Allow GitHub Actions to create and approve pull requests ».
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: togo-dashboard:ci
  HOST_PORT: '8501'

jobs:
  # 1) Quels fichiers ce push a-t-il modifiés ? Le déclencheur est dashboard/ ; on signale
  #    aussi tout autre fichier de code d'application touché (scripts/, notebooks/, data/, requirements racine).
  changements:
    runs-on: ubuntu-latest
    outputs:
      autres_code: ${{ steps.diff.outputs.autres_code }}
      resume: ${{ steps.diff.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Lister les fichiers modifiés par le push
        run: |
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          # Premier push d'une branche (before = 000…) : comparer au commit parent.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse "$head^" 2>/dev/null || echo "$head")"
          fi
          echo "Comparaison $base..$head"
          fichiers="$(git diff --name-only "$base" "$head")"
          echo "--- Fichiers modifiés ---"; echo "$fichiers"; echo "-------------------------"

          nb_dash="$(echo "$fichiers" | grep -c '^dashboard/' || true)"
          autres="$(echo "$fichiers" | grep -E '^(scripts/|notebooks/|data/|requirements\.txt$)' || true)"

          if [ -n "$autres" ]; then echo "autres_code=true" >> "$GITHUB_OUTPUT"; else echo "autres_code=false" >> "$GITHUB_OUTPUT"; fi

          {
            echo "resume<<EOF"
            echo "- Fichiers \`dashboard/\` modifiés : $nb_dash"
            if [ -n "$autres" ]; then
              echo "- Autre code d'application touché par ce push :"
              echo "$autres" | sed 's/^/    - /'
            else
              echo "- Aucun autre fichier de code d'application touché."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # 2) Vérifications Python : installation des dépendances, compilation (syntaxe) et import des modules.
  verifier-python:
    needs: changements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - name: Installer les dépendances du dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt
      - name: Cohérence des dépendances (pip check)
        run: pip check
      - name: Compiler tout le code du dashboard (contrôle de syntaxe)
        run: python -m compileall -q dashboard
      - name: Importer les modules de l'app (résolution des dépendances)
        working-directory: dashboard
        run: python -c "import theme, composants, donnees, i18n, notify; print('Modules importés OK')"

  # 3) Conteneur : build de l'image, lancement, et test que l'app répond vraiment.
  conteneur:
    needs: [changements, verifier-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -f dashboard/Dockerfile -t "$IMAGE" .

      - name: Démarrer le conteneur
        run: docker run -d --name togo-dashboard -p "${HOST_PORT}:8501" "$IMAGE"

      - name: Attendre que l'app réponde (endpoint de santé Streamlit)
        run: |
          echo "Attente de http://localhost:${HOST_PORT}/_stcore/health ..."
          ok=""
          for i in $(seq 1 40); do
            code="$(curl -s -o /tmp/health.txt -w '%{http_code}' "http://localhost:${HOST_PORT}/_stcore/health" || true)"
            if [ "$code" = "200" ] && grep -q "ok" /tmp/health.txt; then
              ok="1"; echo "Santé OK après ${i} tentative(s)."; break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::L'application n'a pas répondu sur l'endpoint de santé."
            docker logs togo-dashboard || true
            exit 1
          fi

      - name: Tester que la page d'accueil répond (HTTP 200)
        run: |
          code="$(curl -s -o /tmp/index.html -w '%{http_code}' "http://localhost:${HOST_PORT}/")"
          echo "GET / → $code"
          test "$code" = "200"
          grep -qi "streamlit" /tmp/index.html || echo "::warning::La page d'accueil répond 200 mais sans marqueur Streamlit attendu."

      - name: Journaux du conteneur
        if: always()
        run: docker logs togo-dashboard || true

      - name: Arrêter et nettoyer le conteneur
        if: always()
        run: docker rm -f togo-dashboard || true

  # 4) Tout est vert → ouvrir (ou mettre à jour) une PR dev → main.
  ouvrir-pr:
    needs: [changements, verifier-python, conteneur]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Créer la PR dev → main si nécessaire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME: ${{ needs.changements.outputs.resume }}
        run: |
          set -e
          git fetch --no-tags origin main || true
          # Rien à proposer si dev n'a aucun commit d'avance sur main.
          ahead="$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 1)"
          if [ "$ahead" = "0" ]; then
            echo "dev n'est pas en avance sur main — aucune PR à ouvrir."
            exit 0
          fi

          {
            echo "PR automatique ouverte par le workflow **Dashboard CI** après un push sur \`dev\` touchant \`dashboard/\`."
            echo ""
            echo "**Contrôles passés ✅**"
            echo "- Installation des dépendances (\`dashboard/requirements.txt\`) et \`pip check\`"
            echo "- Compilation (syntaxe) de tout \`dashboard/\` et import des modules de l'app"
            echo "- Image Docker construite, conteneur démarré, app répondant sur \`/_stcore/health\` et \`/\`"
            echo ""
            echo "**Changements détectés**"
            echo "$RESUME"
            echo ""
            echo "Commit : \`${{ github.sha }}\`"
          } > /tmp/pr_body.md

          existante="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existante" ]; then
            echo "PR #$existante déjà ouverte — mise à jour du corps."
            gh pr edit "$existante" --body-file /tmp/pr_body.md
          else
            gh pr create --base main --head dev \
              --title "Dashboard : dev → main (CI validée)" \
              --body-file /tmp/pr_body.md
          fi
